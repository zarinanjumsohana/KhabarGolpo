<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gallery · Khabar Golpo Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#f4f1ea" />
  <script>(function(){try{var t=localStorage.getItem('kg.admin.theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);document.documentElement.style.colorScheme=t;}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body data-page="gallery">
  <div id="shell-root"></div>

  <main id="page" class="page">
    <div class="page-head">
      <div>
        <span hidden class="kicker">Content</span>
        <h1 class="page-title">Photo <em>gallery</em></h1>
        <p hidden class="page-desc">Photos shown on the customer website. Drop images below, then click a caption to rename it.</p>
      </div>
      <div class="head-actions">
        <button class="btn btn-ghost btn-sm" id="btnUpload"><span data-icon="upload"></span><span>Upload photos</span></button>
      </div>
    </div>

    <div class="dropzone no-print" id="dropzone" tabindex="0" role="button" aria-label="Upload photos">
      <span class="dz-ic" data-icon="image"></span>
      <h4>Drop images here</h4>
      <p>JPG or PNG · up to 2 MB each · they appear on the website gallery right away</p>
      <input type="file" id="fileInput" accept="image/*" multiple class="sr-only" />
    </div>

    <div class="section-label" style="margin-top:28px">Library · <span id="galCount">0</span> photos</div>
    <div class="gal-grid" id="galGrid"></div>
  </main>

  <script type="module" src="../js/pages/gallery.js"></script>
</body>
</html>
