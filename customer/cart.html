<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KhabarGolpo · Your cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Serif:ital@0;1&family=Noto+Serif+Bengali:wght@600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/ambient.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body class="is-mounted">

<div class="ambient" aria-hidden="true">
  <img src="assets/images/background/floral-frame.png" alt="">
</div>

<header class="topbar shop">
  <a class="brand" href="index.html#top" aria-label="KhabarGolpo, home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14.5"/>
      <path d="M16 8c3 3.5 3 7 0 10-3-3-3-6.5 0-10zM9.5 13.5c3.5 0 6 2 6.5 5.5-3.5 0-6-2-6.5-5.5zM22.5 13.5c-.5 3.5-3 5.5-6.5 5.5.5-3.5 3-5.5 6.5-5.5z"/>
    </svg>
    <span class="brand-name">KhabarGolpo</span>
  </a>

  <!-- BACK: goes to the page you came from (category, then menu) -->
  <button class="back-btn" type="button" data-back aria-label="Go back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5"/>
      <path d="M11 6l-6 6 6 6"/>
    </svg>
  </button>

  <nav class="nav-pill" aria-label="Main">
    <ul class="links">
      <li><a href="index.html#top">Home</a></li>
      <li><a href="index.html#story">Our Story</a></li>
      <li><a href="index.html#menu">Menu</a></li>
      <li><a href="index.html#gallery">Galerie</a></li>
      <li><a href="index.html#reservation">Reservation</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
  <a class="cart-btn" href="cart.html" aria-label="Open your cart">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/>
      <path d="M9 8a3 3 0 0 1 6 0"/>
    </svg>
    <span class="cart-count" hidden>0</span>
  </a>
</header>

<main class="shop-main">
  <section class="glass shop-card">
    <p class="kicker">Your plate</p>
    <h1 class="shop-title">Cart</h1>
    <p class="muted" id="cartEmpty" hidden>Your plate is empty. <a href="index.html#menu">Browse the menu</a>.</p>
    <ul class="cart-lines" id="cartLines"></ul>
    <div class="totals" id="totals"></div>
  </section>

  <form class="glass shop-card" id="orderForm" novalidate hidden>
    <p class="kicker">Your details</p>
    <div class="row2">
      <label>Your name <input name="name" maxlength="80" autocomplete="name" required></label>
      <label>Mobile number <input name="phone" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="01XXXXXXXXX" title="11-digit Bangladeshi mobile number, e.g. 01712345678" required></label>
    </div>

    <div class="row2" id="emailRow">
      <label id="emailField">Email address <input name="email" type="email" maxlength="120" autocomplete="email" placeholder="you@example.com"></label>
    </div>

    <div id="otpBox" class="otp-box" hidden>
      <div class="otp-head">
        <span class="otp-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
        </span>
        <div>
          <p class="otp-title">Verify your email</p>
          <p class="otp-hint" id="otpHint">Send a 6-digit code to <span id="otpTarget">your inbox</span>. It stays valid for 5 minutes.</p>
        </div>
      </div>
      <label class="otp-code-label">6-digit code
        <input id="otpInput" name="otp" inputmode="numeric" maxlength="6" pattern="[0-9]*" autocomplete="one-time-code" placeholder="000000">
      </label>
      <button type="button" id="btnSendOtp" class="otp-send">
        <span class="otp-send-ico" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </span>
        <span id="btnSendOtpText">Email me the code</span>
      </button>
      <p class="otp-msg" id="otpMsg" role="alert"></p>
    </div>

    <p class="kicker">How would you like it?</p>
    <div class="mode" role="radiogroup" aria-label="Order type">
      <label><input type="radio" name="mode" value="pickup"> <span>Pickup</span></label>
      <label><input type="radio" name="mode" value="delivery"> <span>Delivery</span></label>
      <label id="dineMode" hidden><input type="radio" name="mode" value="dine-in"> <span id="dineLabel">Dine-in</span></label>
    </div>
    <p class="muted" id="modeNote"></p>

    <div id="pickupBox">
      <label>Pickup time <input name="pickup_time" type="time"></label>
    </div>
    <div id="deliveryBox" hidden>
      <label>Delivery address <textarea name="address" rows="2" maxlength="300"></textarea></label>
      <label>Landmark or note (optional) <input name="address_note" maxlength="200"></label>
    </div>

    <label>Note for the kitchen (optional) <textarea name="note" rows="2" maxlength="200"></textarea></label>
    <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="err" id="orderErr" role="alert"></p>
    <button class="cta" id="placeBtn" type="submit">Place order</button>
  </form>
</main>

<script src="js/mock/content.js"></script>
<script src="js/utils/cart.js"></script>
<script src="js/utils/ambient.js"></script>
<script src="js/pages/cart.js"></script>
</body>
</html>
