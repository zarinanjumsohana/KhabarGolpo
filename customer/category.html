<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KhabarGolpo · Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Serif:ital@0;1&family=Noto+Serif+Bengali:wght@600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/shop.css">
</head>
<body class="is-mounted">


<header class="topbar shop">
  <a class="brand" href="index.html#top" aria-label="KhabarGolpo, home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14.5"/>
      <path d="M16 8c3 3.5 3 7 0 10-3-3-3-6.5 0-10zM9.5 13.5c3.5 0 6 2 6.5 5.5-3.5 0-6-2-6.5-5.5zM22.5 13.5c-.5 3.5-3 5.5-6.5 5.5.5-3.5 3-5.5 6.5-5.5z"/>
    </svg>
    <span class="brand-name">KhabarGolpo</span>
  </a>

  <!-- BACK: goes to the page you came from (category, then menu) -->
  <button class="back-btn" type="button" data-back aria-label="Go back">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5"/>
      <path d="M11 6l-6 6 6 6"/>
    </svg>
  </button>

  <nav class="nav-pill" aria-label="Main">
    <ul class="links">
      <li><a href="index.html#top">Home</a></li>
      <li><a href="index.html#story">Our Story</a></li>
      <li><a href="index.html#menu">Menu</a></li>
      <li><a href="index.html#gallery">Galerie</a></li>
      <li><a href="index.html#reservation">Reservation</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
  <a class="cart-btn" href="cart.html" aria-label="Open your cart">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/>
      <path d="M9 8a3 3 0 0 1 6 0"/>
    </svg>
    <span class="cart-count" hidden>0</span>
  </a>
</header>

<main class="shop-main cat-main">

  <!-- categories: a window of 5 (3 on phones). Arrows slide the window when there are more. -->
  <div class="cat-rail" id="catRail" aria-label="Categories">
    <button class="rail-arrow" id="railUp" type="button" aria-label="Show previous categories" hidden>
      <span class="ar-v">⌃</span><span class="ar-h">‹</span>
    </button>
    <div class="rail-view">
      <div class="rail-track" id="railTrack"></div>
    </div>
    <button class="rail-arrow" id="railDown" type="button" aria-label="Show more categories" hidden>
      <span class="ar-v">⌄</span><span class="ar-h">›</span>
    </button>
  </div>

  <section class="cat-panel glass" aria-labelledby="catName">
    <h1 class="cat-name" id="catName">Menu</h1>

    <div class="dish-stage" id="dishStage">
      <div class="dish-info">
        <h2 id="dishName"></h2>
        <p class="dish-tags" id="dishTags"></p>
        <p class="dish-desc" id="dishDesc"></p>
        <p class="dish-price" id="dishPrice"></p>
        <button class="add-btn" id="addBtn" type="button">Add to plate</button>
        <p class="add-msg" id="addMsg" role="status" aria-live="polite"></p>
      </div>
      <div class="dish-photo"><img id="dishImg" alt=""></div>
    </div>

    <div class="thumbs-wrap">
      <button class="thumb-arrow" id="thumbPrev" type="button" aria-label="Previous dishes" hidden>‹</button>
      <div class="thumbs" id="thumbs" aria-label="Dishes in this category"></div>
      <button class="thumb-arrow" id="thumbNext" type="button" aria-label="More dishes" hidden>›</button>
    </div>
    <p class="empty" id="empty" hidden></p>
  </section>
</main>

<script src="js/mock/content.js"></script>
<script src="js/utils/cart.js"></script>
<script src="js/pages/category.js"></script>
</body>
</html>
