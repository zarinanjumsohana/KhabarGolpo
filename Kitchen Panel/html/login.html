<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chef Sign in &middot; Khabar Golpo Kitchen</title>
  <meta name="description" content="Sign in to the Khabar Golpo kitchen display system." />
  <meta name="theme-color" content="#f2f3f2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/kitchen.css" />
  <script>(function(){try{var s=localStorage.getItem('kg.kitchen.theme');if(s!=='dark'&&s!=='light'){s=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',s);document.documentElement.style.colorScheme=s;}catch(e){document.documentElement.setAttribute('data-theme','light');document.documentElement.style.colorScheme='light';}})();</script>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card">
      <button class="icon-btn tt-btn" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false">
        <svg class="tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" />
        </svg>
        <svg class="tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.3 14.4A8.5 8.5 0 1 1 9.6 3.7a6.6 6.6 0 0 0 10.7 10.7Z" />
        </svg>
      </button>

      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11h18" />
            <path d="M3.5 11a8.5 8.5 0 0 0 17 0" />
            <path d="M9.2 7.6c0-1.1 1.1-1.3 1.1-2.4" />
            <path d="M13.7 7.6c0-1.1 1.1-1.3 1.1-2.4" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Khabar Golpo</span>
          <span class="brand-sub">Kitchen Display</span>
        </span>
      </div>

      <h1 class="login-title">Chef sign in</h1>
      <p class="login-sub">Only kitchen accounts can open the display. Admin accounts stay in the admin panel.</p>

      <form action="index.html" method="get">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="chef@khabargolpo.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>

      <p class="login-foot">Kitchen accounts are created by the restaurant owner - there is no sign-up.</p>
    </section>
  </main>
  <script src="../js/kitchen.js" defer></script>
</body>
</html>
