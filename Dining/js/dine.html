<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KhabarGolpo · Dine-in Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Serif:ital@0;1&family=Noto+Serif+Bengali:wght@600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../customer/css/hero.css">
<link rel="stylesheet" href="../customer/css/ambient.css">
<link rel="stylesheet" href="../customer/css/sections.css">
<link rel="stylesheet" href="../customer/css/shop.css">
<link rel="stylesheet" href="css/dine.css">
</head>
<body class="is-mounted">

<div class="ambient" aria-hidden="true">
  <img src="../customer/assets/images/background/floral-frame.png" alt="">
</div>

<header class="topbar shop">
  <!-- logo: always brings you back to the first page of this dining menu -->
  <a class="brand" id="homeLink" href="dine.html" aria-label="KhabarGolpo dine-in menu, first page">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="14.5"/>
      <path d="M16 8c3 3.5 3 7 0 10-3-3-3-6.5 0-10zM9.5 13.5c3.5 0 6 2 6.5 5.5-3.5 0-6-2-6.5-5.5zM22.5 13.5c-.5 3.5-3 5.5-6.5 5.5.5-3.5 3-5.5 6.5-5.5z"/>
    </svg>
    <span class="brand-name">KhabarGolpo</span>
  </a>

  <!-- centre: which table this order is for -->
  <span class="dn-table" id="tableChip" hidden></span>

  <!-- top right: cart. Click to show or hide the plate drawer. -->
  <div class="dn-actions">
    <button class="cart-btn dn-plate-btn" id="plateBtn" type="button" aria-label="Show or hide your plate" aria-expanded="false" aria-controls="drawer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8L5 8z"/>
        <path d="M9 8a3 3 0 0 1 6 0"/>
      </svg>
      <span class="cart-count" id="plateCount" hidden>0</span>
    </button>
  </div>
</header>

<main class="shop-main dn-main" id="dnMain">
  <div class="dn-head">
    <p class="kicker">Welcome to KhabarGolpo</p>
    <h1 class="shop-title" id="dnTitle">Dine-in Menu</h1>
  </div>

  <div class="dn-rail">
    <button class="dn-arrow" id="catPrev" type="button" aria-label="Previous" hidden>&lsaquo;</button>
    <div class="dn-cats" id="dnCats" aria-label="Categories"></div>
    <button class="dn-arrow" id="catNext" type="button" aria-label="More" hidden>&rsaquo;</button>
  </div>

  <div class="dn-tools">
    <label class="dn-search">
      <span class="sr">Search dishes</span>
      <input id="dnSearch" type="search" placeholder="Search dishes" autocomplete="off" maxlength="60">
    </label>
  </div>

  <div class="dn-grid" id="dnGrid"></div>
  <p class="empty" id="dnEmpty" hidden>No dishes here yet.</p>
</main>

<!-- plate drawer: your plate, place order, and the orders of your table with their status -->
<aside class="dn-drawer" id="drawer" aria-label="Your plate" aria-hidden="true">
  <form class="dn-form" id="plForm" novalidate>
    <div class="dn-scroll" id="drawerScroll">
      <div class="dn-sec-head">
        <div>
          <p class="kicker">Your order</p>
          <h2 id="plTitle">Your plate</h2>
        </div>
        <button class="dn-x" id="drawerClose" type="button" aria-label="Hide the plate">›</button>
      </div>

      <p class="muted" id="plEmpty">Your plate is empty. Tap "Add to plate" under a dish.</p>
      <ul class="cart-lines" id="plLines"></ul>
      <div class="totals" id="plTotals"></div>

      <div id="plFields">
        <div class="row2">
          <label>Your name (optional) <input name="name" maxlength="80" autocomplete="name"></label>
          <label>Table no. (required)
            <select name="table" required></select>
          </label>
        </div>
        <p class="dn-hint" id="tableHint" hidden>Table is set by the QR code on your table.</p>
        <label>Note for the kitchen (optional) <textarea name="note" rows="2" maxlength="200"></textarea></label>
        <input class="hp" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p class="err" id="plErr" role="alert"></p>
      </div>

      <!-- orders of this table and their live status -->
      <section class="dn-orders" id="ordersSec" aria-live="polite">
        <h3 id="ordersTitle">Orders for your table</h3>
        <p class="muted" id="ordersEmpty" hidden></p>
        <div id="ordersList"></div>
      </section>
    </div>

    <div class="dn-foot" id="plFoot">
      <div class="dn-foot-total"><span id="footCount">0 items</span><b id="footTotal"></b></div>
      <button class="cta" id="plPlace" type="submit">Place order</button>
    </div>
  </form>
</aside>

<!-- dish card: opens when you tap a dish (photo, description, price) -->
<dialog class="dn-dlg glass" id="itemDlg" aria-labelledby="idName">
  <button class="dn-x" id="itemClose" type="button" aria-label="Close">×</button>
  <div class="dn-dish-photo"><img id="idImg" alt=""></div>
  <h2 id="idName"></h2>
  <p class="dish-tags" id="idTags"></p>
  <p class="dish-desc" id="idDesc"></p>
  <p class="dish-price" id="idPrice"></p>
  <div class="dn-qty-row">
    <div class="qty">
      <button class="qty-btn" id="idMinus" type="button" aria-label="Reduce quantity">−</button>
      <span class="qty-val" id="idQty">1</span>
      <button class="qty-btn" id="idPlus" type="button" aria-label="Increase quantity">+</button>
    </div>
    <button class="add-btn" id="idAdd" type="button">Add to plate</button>
  </div>
  <p class="add-msg" id="idMsg" role="status" aria-live="polite"></p>
</dialog>

<script src="../customer/js/mock/content.js"></script>
<script src="../customer/js/utils/ambient.js"></script>
<script src="js/dine.js"></script>
</body>
</html>
